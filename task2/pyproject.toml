[tool.poetry]
name = "ase2025-starter-kit"
version = "0.1.0"
description = "Starter kit for the Co4 competition"
authors = ["Egor Bogomolov <egor.bogomolov@jetbrains.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
jsonlines = "^4.0.0"
argparse = "^1.4.0"
tqdm = "^4.67.1"
rank-bm25 = "^0.2.2"
pyyaml = "^6.0.3"
sentence-transformers = {version = "^5.3.0", python = ">=3.11,<3.15"}
numpy = {version = "^2.4.3", python = ">=3.11,<3.15"}
faiss-cpu = {version = "^1.13.2", python = ">=3.11,<3.15"}
openai = {version = "^2.28.0", python = ">=3.11,<3.15"}
qdrant-client = {version = "^1.17.1", python = ">=3.11,<3.15"}
fastembed = {version = "^0.7.4", python = ">=3.11,<3.15"}
dotenv = "^0.9.9"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
